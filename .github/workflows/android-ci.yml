name: Android CI

on:
  push:
    branches:
      - main
      - feature/android-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build arm64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('app/flutter/pubspec.lock') }}

      - name: Generate Android host and install Kotlin bridge
        working-directory: app/flutter
        run: python3 ../../tool/bootstrap_android.py

      - name: Install dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Check formatting
        working-directory: app/flutter
        run: |
          dart format lib test
          git diff -- lib test

      - name: Analyze
        working-directory: app/flutter
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app/flutter
        run: flutter test

      - name: Build optimized Android APK (ARM64)
        working-directory: app/flutter
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Check APK size (100 MB limit)
        working-directory: app/flutter
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "ARM64 APK size: $((SIZE / 1024 / 1024)) MB"
          echo "Largest APK entries:"
          unzip -l "$APK" | sort -nr | head -25
          echo "Native library sizes:"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\\.so$' | sort -nr | head -20
          test "$SIZE" -le 104857600 || { echo "APK exceeds 100 MB"; exit 1; }

      - name: Upload optimized ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bunker-vpn-arm64-release
          path: app/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        working-directory: app/flutter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          TAG="bunker-vpn-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BUNKER VPN build ${GITHUB_RUN_NUMBER}" \
            --notes "ARM64 release APK. Built from commit ${GITHUB_SHA}."
